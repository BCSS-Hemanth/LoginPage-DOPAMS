<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOPAMS — Intelligence Portal | Telangana Police</title>
  <meta name="description" content="Telangana Police Narcotics Intelligence Portal — DOPAMS Login Gateway.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/eagle-force-logo.png">

  <!-- Google Fonts: Exo 2 (futuristic tech sans with clearly distinct D and O), Inter, Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap"
    rel="stylesheet">

  <!-- Stylesheets (v=16.0 Cache-Busting) -->
  <link rel="stylesheet" href="css/styles.css?v=16.0">
  <link rel="stylesheet" href="css/animations.css?v=16.0">
  <link rel="stylesheet" href="css/responsive.css?v=16.0">
</head>

<body>
  <!-- Full Screen Scene Wrapper -->
  <div class="scene-container" id="sceneContainer">

    <!-- Layer 1: Background Layer with Original High-Resolution Investigation Image -->
    <div class="bg-wrapper" id="bgWrapper">
      <div class="bg-layer" id="bgLayer"></div>
    </div>


    <!-- Accurately Aligned Deep Red Intelligence Target Beacon -->
    <div class="intel-red-beacon" id="intelRedBeacon" aria-hidden="true">
      <div class="red-aura"></div>
      <div class="red-sonar-ring ring-1"></div>
      <div class="red-sonar-ring ring-2"></div>
      <div class="red-sonar-ring ring-3"></div>
      <div class="red-core"></div>
      <div class="red-center-dot"></div>
    </div>

    <!-- Targeted Dark Gradient Overlay (Preserves Left/Center Evidence, Frames Card on Right) -->
    <div class="vignette-overlay" aria-hidden="true"></div>

    <!-- Layer 3: Ambient Floating Particles Canvas (Drifting in Dark/Edge Zones, Behind Login Panel) -->
    <canvas id="ambientCanvas" class="ambient-particle-canvas" aria-hidden="true"></canvas>

    <!-- Layer 5: Main Content Layout -->
    <main class="main-layout">
      <!-- Right Column: Cinematic Glassmorphic Login Card -->
      <section class="login-section" aria-label="Authentication Panel">

        <!-- Localized Backdrop Glow Behind Card -->
        <div class="card-ambient-glow" aria-hidden="true"></div>

        <!-- Layer 4 & 5: The DOPAMS Login Card -->
        <div class="login-card" id="loginCard">

          <!-- Outer Breathing Border Light -->
          <div class="card-border-light" aria-hidden="true"></div>

          <!-- Background Eagle Force Emblem Inside Login Box -->
          <div class="card-bg-emblem" aria-hidden="true">
            <img src="assets/images/eagle-force-logo.png" alt="Eagle Force Emblem Background" class="bg-emblem-img"
              loading="eager" />
          </div>

          <!-- Card Content Container -->
          <div class="card-inner-content">

            <!-- Card Header: Centered DOPAMS Title -->
            <div class="card-header">
              <h1 class="card-title">DOPAMS</h1>
            </div>

            <!-- Login Form (Frontend Visual Implementation Only) -->
            <form class="login-form" id="loginForm" autocomplete="off" onsubmit="return false;">

              <!-- Field: Username / Mail ID -->
              <div class="form-group">
                <label for="usernameInput" class="form-label">USERNAME / MAIL ID</label>
                <div class="input-control">
                  <span class="input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                      stroke-linejoin="round">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                  </span>
                  <input type="text" id="usernameInput" name="username" class="text-input"
                    placeholder="Enter Username or Mail ID" required autocomplete="username" spellcheck="false" />
                </div>
              </div>

              <!-- Field: Password -->
              <div class="form-group">
                <label for="passwordInput" class="form-label">PASSWORD</label>
                <div class="input-control">
                  <span class="input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                      stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                  </span>
                  <input type="password" id="passwordInput" name="password" class="text-input"
                    placeholder="Enter Password" required autocomplete="current-password" />
                  <!-- Password Visibility Toggle Button -->
                  <button type="button" id="passwordToggleBtn" class="visibility-toggle-btn" aria-label="Show password"
                    title="Toggle password visibility">
                    <!-- Eye Icon (Password Hidden) -->
                    <svg class="eye-icon eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <!-- Eye Off Icon (Password Visible) -->
                    <svg class="eye-icon eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <path
                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                      </path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Options Row: Custom Remember Checkbox & Forgot Password Link -->
              <div class="form-options-row">
                <!-- Functional Visual Custom Checkbox -->
                <label class="custom-checkbox-container" for="rememberMeCheckbox">
                  <input type="checkbox" id="rememberMeCheckbox" name="remember" class="native-checkbox">
                  <span class="custom-checkbox-box" aria-hidden="true">
                    <svg class="checkmark-svg" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5"
                      stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="2.5 7 5.5 10 11.5 3.5"></polyline>
                    </svg>
                  </span>
                  <span class="checkbox-text">Remember</span>
                </label>

                <!-- Forgot Password Text Link -->
                <a href="#forgot-credentials" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
              </div>

              <!-- Primary Authorization Button -->
              <div class="form-action-group">
                <button type="button" class="authorize-btn" id="authorizeAccessBtn">
                  <!-- Shield Icon -->
                  <span class="btn-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                      stroke-linejoin="round">
                      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                      <polyline points="9 12 11 14 15 10"></polyline>
                    </svg>
                  </span>
                  <span class="btn-label">AUTHORIZE SYSTEM ACCESS</span>
                  <!-- Animated Light Sweep Sheen -->
                  <span class="btn-sheen" aria-hidden="true"></span>
                </button>
              </div>

            </form>

          </div>
        </div>

      </section>
    </main>

  </div>

  <!-- Application Logic -->
  <script src="js/app.js?v=14.0"></script>
</body>

</html>
